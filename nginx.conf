worker_processes 1;

events {
  worker_connections 1024;
}

http {
  server {
    listen 8080;
    server_name _;

    # The client HMR plugin keeps this EventSource connection open while the
    # page is loaded. It can be idle for more than Nginx's default 60 seconds.
    location = /plugins/events {
      proxy_pass http://127.0.0.1:3080;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:3080;
      proxy_set_header Origin http://127.0.0.1:3080;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location / {
      proxy_pass http://127.0.0.1:3080;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:3080;
      proxy_set_header Origin http://127.0.0.1:3080;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
